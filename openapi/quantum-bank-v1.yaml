openapi: 3.1.0
info:
  title: Quantum Bank API
  version: 1.0.0
  description: App-facing KrakenD API contract for Quantum Bank local v1.
servers:
  - url: https://localhost:8080
    description: Local KrakenD bootstrap listener; OAuth2Bearer only before certificate readiness.
  - url: https://localhost:8443
    description: Local KrakenD banking listener; OAuth2Bearer plus MutualTLS for protected banking.
tags:
  - name: Auth
  - name: Pix
  - name: Statements
  - name: Profile
paths:
  /auth/otk:
    post:
      tags: [Auth]
      summary: Issue a one-time token for CSR bootstrap.
      operationId: issueOtk
      x-required-scopes:
        - openid
        - profile
      security:
        - OAuth2Bearer: []
      x-listener: bootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtkIssueRequest'
      responses:
        "201":
          description: OTK issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtkIssueResponse'
        "400":
          $ref: '#/components/responses/BadRequestProblem'
        "401":
          $ref: '#/components/responses/UnauthorizedProblem'
        "500":
          $ref: '#/components/responses/InternalProblem'
  /auth/csr:
    post:
      tags: [Auth]
      summary: Submit CSR and OTK for mobile client certificate issuance.
      operationId: submitCsr
      x-required-scopes:
        - openid
        - profile
      security:
        - OAuth2Bearer: []
      x-listener: bootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrSubmitRequest'
      responses:
        "201":
          description: CSR accepted and certificate issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrSubmitResponse'
        "400":
          $ref: '#/components/responses/BadRequestProblem'
        "401":
          $ref: '#/components/responses/UnauthorizedProblem'
        "409":
          $ref: '#/components/responses/ConflictProblem'
        "500":
          $ref: '#/components/responses/InternalProblem'
  /pix/transfers:
    post:
      tags: [Pix]
      summary: Simulate a Pix transfer success or error path.
      operationId: createPixTransfer
      x-required-scopes:
        - pix:write
      security:
        - OAuth2Bearer: []
          MutualTLS: []
      x-listener: banking
      x-quantum-envelope: required
      requestBody:
        required: true
        description: >-
          Plaintext schema `PixTransferRequest`; app-edge clients send it sealed in
          the hybrid post-quantum envelope (`application/vnd.quantum-bank.envelope+json`,
          see `EnvelopeMessage`). Strict-tier service clients may send plain JSON.
        content:
          application/vnd.quantum-bank.envelope+json:
            schema:
              $ref: '#/components/schemas/EnvelopeMessage'
          application/json:
            schema:
              $ref: '#/components/schemas/PixTransferRequest'
      responses:
        "200":
          description: >-
            Pix transfer simulated as success. Enveloped requests receive the response
            sealed in an `EnvelopeMessage` whose plaintext is `PixTransferSuccessResponse`
            (header `X-Quantum-Envelope-Content-Type: application/json`).
          content:
            application/vnd.quantum-bank.envelope+json:
              schema:
                $ref: '#/components/schemas/EnvelopeMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/PixTransferSuccessResponse'
        "400":
          $ref: '#/components/responses/BadRequestProblem'
        "401":
          $ref: '#/components/responses/UnauthorizedProblem'
        "403":
          $ref: '#/components/responses/ForbiddenProblem'
        "500":
          $ref: '#/components/responses/InternalProblem'
  /statements:
    get:
      parameters:
        - $ref: '#/components/parameters/QuantumEnvelopeHeader'
      tags: [Statements]
      summary: Retrieve account statement entries.
      operationId: getStatements
      x-required-scopes:
        - statements:read
      security:
        - OAuth2Bearer: []
          MutualTLS: []
      x-listener: banking
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Statement data.
          content:
            application/vnd.quantum-bank.envelope+json:
              schema:
                $ref: '#/components/schemas/EnvelopeMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/StatementResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedProblem'
        "403":
          $ref: '#/components/responses/ForbiddenProblem'
        "500":
          $ref: '#/components/responses/InternalProblem'
  /profile:
    get:
      parameters:
        - $ref: '#/components/parameters/QuantumEnvelopeHeader'
      tags: [Profile]
      summary: Retrieve customer registration data.
      operationId: getProfile
      x-required-scopes:
        - profile:read
      security:
        - OAuth2Bearer: []
          MutualTLS: []
      x-listener: banking
      responses:
        "200":
          description: Customer profile data.
          content:
            application/vnd.quantum-bank.envelope+json:
              schema:
                $ref: '#/components/schemas/EnvelopeMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedProblem'
        "403":
          $ref: '#/components/responses/ForbiddenProblem'
        "500":
          $ref: '#/components/responses/InternalProblem'
    put:
      tags: [Profile]
      summary: Edit customer registration data.
      operationId: updateProfile
      x-required-scopes:
        - profile:write
      security:
        - OAuth2Bearer: []
          MutualTLS: []
      x-listener: banking
      requestBody:
        required: true
        content:
          application/vnd.quantum-bank.envelope+json:
            schema:
              $ref: '#/components/schemas/EnvelopeMessage'
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        "200":
          description: Updated customer profile data.
          content:
            application/vnd.quantum-bank.envelope+json:
              schema:
                $ref: '#/components/schemas/EnvelopeMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        "400":
          $ref: '#/components/responses/BadRequestProblem'
        "401":
          $ref: '#/components/responses/UnauthorizedProblem'
        "403":
          $ref: '#/components/responses/ForbiddenProblem'
        "500":
          $ref: '#/components/responses/InternalProblem'
components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    MutualTLS:
      type: mutualTLS
  responses:
    BadRequestProblem:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedProblem:
      description: Missing or invalid OAuth2 bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenProblem:
      description: mTLS or authorization requirement failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictProblem:
      description: Request conflicts with OTK or certificate state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalProblem:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  parameters:
    QuantumEnvelopeHeader:
      name: X-Quantum-Envelope
      in: header
      required: false
      description: >-
        Base64url `EnvelopeMessage` (without `nonce`/`ciphertext`) carrying the
        ML-KEM-768 ciphertext and the ephemeral X25519 key of a request without a
        body. Required for app-edge OAuth2 clients (feature 012); the response is
        then sealed in an `EnvelopeMessage`.
      schema:
        type: string
  schemas:
    EnvelopeMessage:
      type: object
      description: >-
        Hybrid post-quantum application envelope (contract envelope-v1): the
        request encapsulates to the backend's ML-KEM-768 and X25519 keys and seals
        the JSON body with AES-256-GCM under an HKDF-SHA-256 key bound to
        `METHOD PATH`; the response reuses the request secret (response key).
      required:
        - v
        - kid
      properties:
        v:
          type: integer
          enum: [1]
        kid:
          type: string
          maxLength: 64
        mlkemCiphertext:
          type: string
          format: byte
          description: 1088-byte FIPS 203 ML-KEM-768 ciphertext (requests only).
        x25519PublicKey:
          type: string
          format: byte
          description: 32-byte ephemeral X25519 public key (requests only).
        nonce:
          type: string
          format: byte
          description: 12-byte AES-GCM nonce.
        ciphertext:
          type: string
          format: byte
          description: AES-256-GCM ciphertext with 16-byte tag.
        contentType:
          type: string
          description: Media type of the decrypted body (responses only).
    EnvelopeKeySet:
      type: object
      required: [kid, alg, mlkemPublicKey, x25519PublicKey, notAfter]
      properties:
        kid:
          type: string
        alg:
          type: string
          enum: [X25519MLKEM768-HKDF-SHA256-AES256GCM]
        mlkemPublicKey:
          type: string
          format: byte
          description: 1184-byte ML-KEM-768 encapsulation key.
        x25519PublicKey:
          type: string
          format: byte
        notAfter:
          type: string
          format: date-time
    SignedEnvelopeKeySet:
      type: object
      description: >-
        Envelope key set signed with the backend's PKI-issued ML-DSA-65 identity
        (context `quantum-bank-envelope-keys-v1`); the app verifies the chain up
        to the bundled ML-DSA-87 root in pure Dart.
      required: [keySet, signature, signerChain]
      properties:
        keySet:
          $ref: '#/components/schemas/EnvelopeKeySet'
        signature:
          type: string
          format: byte
        signerChain:
          type: array
          items:
            type: string
            description: PEM certificate, leaf first.
    SigningKeyRegistration:
      type: object
      description: >-
        Device ML-DSA-65 signing key registered at enrollment; `proof` is an
        ML-DSA-65 signature over the DER CSR (context `quantum-bank-signing-key-v1`).
      required: [alg, publicKey, proof]
      properties:
        alg:
          type: string
          enum: [ML-DSA-65]
        publicKey:
          type: string
          format: byte
          description: 1952-byte FIPS 204 public key.
        proof:
          type: string
          format: byte
    TransactionSignature:
      type: object
      description: >-
        ML-DSA-65 signature of the canonical Pix order (context
        `quantum-bank-pix-v1`), nonce-protected against replay; required for
        app-edge OAuth2 clients.
      required: [alg, deviceId, nonce, issuedAt, value]
      properties:
        alg:
          type: string
          enum: [ML-DSA-65]
        deviceId:
          type: string
        nonce:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        value:
          type: string
          format: byte
    OtkIssueRequest:
      type: object
      required:
        - appInstanceId
        - deviceId
        - certificateProfile
      properties:
        appInstanceId:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
        certificateProfile:
          type: string
          enum:
            - quantum-bank-mobile-client-v1
    OtkIssueResponse:
      type: object
      required:
        - otk
        - expiresAt
        - correlationId
      properties:
        otk:
          type: string
        expiresAt:
          type: string
          format: date-time
        correlationId:
          type: string
    CsrSubmitRequest:
      type: object
      required:
        - otk
        - csr
        - appInstanceId
        - deviceId
        - certificateProfile
      properties:
        otk:
          type: string
        csr:
          type: string
          description: PEM encoded certificate signing request.
        appInstanceId:
          type: string
        deviceId:
          type: string
        certificateProfile:
          type: string
          enum:
            - quantum-bank-mobile-client-v1
        environment:
          type: string
        signingKey:
          $ref: '#/components/schemas/SigningKeyRegistration'
    CsrSubmitResponse:
      type: object
      required:
        - certificate
        - certificateChain
        - expiresAt
        - correlationId
      properties:
        certificate:
          type: string
          description: PEM encoded client certificate.
        certificateChain:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        correlationId:
          type: string
        envelopeKeys:
          $ref: '#/components/schemas/SignedEnvelopeKeySet'
    PixTransferRequest:
      type: object
      required:
        - amount
        - recipientKey
        - scenario
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        recipientKey:
          type: string
        description:
          type: string
        scenario:
          type: string
          enum:
            - SUCCESS
            - ERROR
        signature:
          $ref: '#/components/schemas/TransactionSignature'
    PixTransferSuccessResponse:
      type: object
      required:
        - transactionId
        - status
        - amount
        - createdAt
        - correlationId
      properties:
        transactionId:
          type: string
        status:
          type: string
          enum:
            - COMPLETED
        amount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        correlationId:
          type: string
    StatementResponse:
      type: object
      required:
        - accountId
        - entries
        - correlationId
      properties:
        accountId:
          type: string
        entries:
          type: array
          items:
            type: object
            required:
              - id
              - postedAt
              - description
              - amount
            properties:
              id:
                type: string
              postedAt:
                type: string
                format: date-time
              description:
                type: string
              amount:
                type: number
                format: double
        correlationId:
          type: string
    ProfileResponse:
      type: object
      required:
        - subject
        - fullName
        - email
        - phone
        - documentNumber
        - address
        - updatedAt
        - correlationId
      properties:
        subject:
          type: string
        fullName:
          type: string
        documentNumber:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        updatedAt:
          type: string
          format: date-time
        correlationId:
          type: string
    ProfileUpdateRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - address
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - errorCode
        - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errorCode:
          type: string
        correlationId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
