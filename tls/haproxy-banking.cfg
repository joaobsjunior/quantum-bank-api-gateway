# TLS terminator for the KrakenD banking listener.
#
# KrakenD (Go crypto/tls) cannot terminate ML-DSA certificates or verify
# ML-DSA-signed peers, so every TLS hop of the gateway is owned by this HAProxy
# process (OpenSSL >= 3.5) that shares the KrakenD container network namespace:
#
#   mobile/app ──mTLS 1.3 (X25519MLKEM768 preferred, X25519 accepted;
#                ML-DSA-65 or ECDSA P-256 identities on both sides)──> :8443 ┐ this process
#                                                                              │ 127.0.0.1 only
#   KrakenD 127.0.0.1:18443  <──plain HTTP over loopback─────────────────────┘
#   KrakenD ──plain HTTP over loopback──> 127.0.0.1:18081 ──mTLS (gateway-client, ML-DSA only)──> backend:8080
#   KrakenD ──plain HTTP over loopback──> 127.0.0.1:18082 ──TLS (ML-DSA only)──> keycloak:8443 (JWKS)
#
# Listener classes (see docs/pqc-ml-dsa-transport.md in the superproject):
#   * the app-facing bind is a dual-identity mTLS listener: TLS 1.3 selects
#     the server certificate from the client's signature_algorithms (ML-DSA
#     chain for PQ-only clients, ECDSA P-256 compatibility chain for
#     Dart/BoringSSL and browsers) and verifies the client certificate against
#     the union of both PKI chains. The hybrid group is preferred; X25519 is
#     accepted. RSA and ML-DSA-44 are refused inside the handshake.
#   * every egress `server` line stays strict: ML-DSA schemes and the hybrid
#     group only (the global ssl-default-server-* policy below).
#
# Loopback traffic never leaves the network namespace; every socket that
# crosses a container or host boundary is authenticated by a PKI-issued
# certificate and, wherever the peer can, post-quantum key-exchanged.
global
  log stdout format raw local0 info
  # Strict defaults: TLS 1.3, hybrid group only, ML-DSA schemes only. The
  # app-facing bind below widens its own curves/sigalgs explicitly; every
  # egress server line inherits these strict values.
  ssl-default-bind-options ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3
  ssl-default-server-options ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3
  ssl-default-bind-curves X25519MLKEM768
  ssl-default-server-curves X25519MLKEM768
  ssl-default-bind-sigalgs mldsa65:mldsa87
  ssl-default-bind-client-sigalgs mldsa65:mldsa87
  ssl-default-server-sigalgs mldsa65:mldsa87
  ssl-default-server-client-sigalgs mldsa65:mldsa87
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
  ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
  tune.ssl.default-dh-param 2048

defaults
  mode http
  log global
  option httplog
  option dontlognull
  option http-server-close
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s


# App-facing banking listener: OAuth2 plus app-to-gateway mTLS. The client
# certificate must chain to one of the two local PKI chains and be signed
# with an accepted scheme (ML-DSA-65/87 or ECDSA P-256); a missing, untrusted,
# expired, RSA or ML-DSA-44 client certificate fails inside the TLS handshake,
# never as HTTP. Dual server identity: the compatibility certificate is listed
# first so it is also the default for clients that send no SNI.
frontend banking_ingress
  bind :8443 ssl crt /etc/quantum-bank/tls/gateway-server-compat.pem crt /etc/quantum-bank/tls/gateway-server.pem ca-file /etc/quantum-bank/tls/ca-chain-all.crt verify required curves X25519MLKEM768:X25519 sigalgs mldsa65:mldsa87:ecdsa_secp256r1_sha256:ecdsa_secp384r1_sha384 client-sigalgs mldsa65:mldsa87:ecdsa_secp256r1_sha256:ecdsa_secp384r1_sha384 alpn http/1.1
  http-request del-header X-Forwarded-For
  http-request del-header Forwarded
  default_backend krakend_banking

backend krakend_banking
  server krakend 127.0.0.1:18443

# Egress: KrakenD -> backend over gateway-to-backend mTLS with the PKI-issued
# gateway client identity (CN=gateway-client, pinned by the backend).
frontend backend_egress
  bind 127.0.0.1:18081
  default_backend backend_mtls

backend backend_mtls
  http-request set-header Host backend:8080
  server backend backend:8080 ssl crt /etc/quantum-bank/tls/gateway-client.pem ca-file /etc/quantum-bank/tls/ca-chain.crt verify required sni str(backend) resolvers docker init-addr none

# Egress: KrakenD JWKS retrieval -> Keycloak TLS terminator, server-authenticated.
frontend issuer_egress
  bind 127.0.0.1:18082
  default_backend issuer_tls

backend issuer_tls
  http-request set-header Host keycloak:8443
  server keycloak keycloak:8443 ssl ca-file /etc/quantum-bank/tls/ca-chain.crt verify required sni str(keycloak) resolvers docker init-addr none
